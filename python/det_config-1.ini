# det_config.ini -- parameters for the gs_det_*.py detection pipeline
#
# FAIRNESS RULE: nothing in this file (or anywhere in the gs_det_*.py
# scripts) may be derived from or read out of the generation block's
# gen_config.ini / *.json ground truth. Everything here is either a
# physical constant, the array's own known installed geometry, a detector
# design choice (thresholds, search windows), or a reference library of
# KNOWN ammunition signatures (legitimate prior knowledge a real classifier
# would have -- not the ground truth of what was actually fired).

[geometry]
# The array's OWN installed geometry -- a real detector legitimately knows
# this (it's fixed hardware), unlike the shooter's position/trajectory.
#
# Installed-array preset used when -mic_config is not given on the command
# line (Stage 1; Stages 2-4 reuse the preset recorded in the upstream .json):
#   python gs_det_signal_prepare.py input.wav -mic_config=UMA8
# Each preset is a [mic_config.<NAME>] section below; add your own section to
# define another array. Keys a preset does not set fall back to this section.
#   PILAR-V          the real PILAR-V sensor (Cipatat recordings) -- use for real data
#   Tetrahedral-0,3  regular tetrahedron, 0.30 m edge (simulation default; matches gen_config.ini)
#   UMA8             miniDSP UMA-8 v2 (4 of its mics)
mic_config = Tetrahedral-0,3

[mic_config.PILAR-V]
# PILAR-V acoustic sensor ("Trackball"; nominal geometry, identical in every unit's
# configuration header (format_version 2). This is the array of the Cipatat recordings
# (sound/Cipatat): 4 channels, 51.2 kHz, 24-bit, 8.8 mV/Pa per mic.
#   ch1-ch3: horizontal ring, radius 0.2055 m, at 0 / 120 / 240 deg (0.356 m apart)
#   ch4:     on the vertical axis, 0.2412 m above the ring (0.317 m from each ring mic)
# Recording channels 0-3 = ch1-ch4 (natural order, verified on Cipatat: direction errors
# 2.4 deg az / 2.0 deg el RMS, Nov 2026). Sensor frame: x = north (within ~1 deg on Cipatat),
# y = west, z = up -- so compass azimuth (clockwise from north) = -atan2(y, x) of the
# pipeline's direction vector. Largest mic spacing 0.356 m -> max TDOA ~1.04 ms.
array_type = custom
mic_positions = 0.2055,0,0; -0.1028,0.178,0; -0.1028,-0.178,0; 0,0,0.2412

[mic_config.Tetrahedral-0,3]
# Regular tetrahedral 4-mic array (the project's original simulation geometry, formerly
# named "PilarV"). Note: l_array = 0.30 m is the EDGE length (mic-to-mic spacing); the
# circumradius is 0.184 m. Old .json files that say mic_config = PilarV resolve to this preset.
array_type = tetrahedron
l_array = 0.30

[mic_config.UMA8]
# miniDSP UMA-8 v2 USB mic array (see devices/UMA-8-usb_mic_array.md), using 4 of
# its 7 mics: the centre mic #0 (origin) and ring mics #1, #3, #5 (42.5 mm radius,
# 120 deg apart -> equilateral triangle, 73.6 mm side), all at z = 0 (board lying
# flat, z up). Positions in metres, x,y,z per mic, in the order #0, #1, #3, #5.
array_type = custom
mic_positions = 0,0,0; 0,0.0425,0; 0.036806,-0.02125,0; -0.036806,-0.02125,0
# Recording channel (0-based) of each mic above, in order -- used only when the
# recording has more channels than mics (UMA-8 RAW firmware records 8 channels,
# the 8th is the spare PDM input). Verify the order on the real board by tapping
# each mic.
channel_map = 0,1,3,5
# A planar array cannot tell whether a sound comes from above or below its
# plane: 'above' = sources on the +z side (array lying flat, looking up),
# 'below' = -z side. Affects only the sign of the elevation.
planar_source_side = above

[physics]
speed_of_sound = 343.0
# Ambient pressure (Pa), used by the Whitham N-wave equations of Stage 4 Method B
atmospheric_pressure_pa = 101325.0
# Air temperature (deg C) of this recording. When set, Stage 3 uses
# c = 331.3 + 0.606 * temperature_c instead of speed_of_sound (Stage 3 also
# takes --temperature-c on the command line). Leave empty to use speed_of_sound.
temperature_c =

[detection]
# method = classify (default) or threshold.
#
# classify: array-level event classifier (gs_det_events.py). Every event is
#   labelled shockwave (SW) or muzzle blast (MB) by its frequency content and
#   time/duration; SW and MB are each optional and the MB does not have to
#   follow a SW (blast-only and SW-only recordings are handled). Thresholds
#   below were tuned on REAL recordings (Cipatat test range, 51.2 kHz, 5.56 mm
#   to 120 mm, 300-1470 m) -- a detector design choice, not generation truth.
# threshold: the original per-channel two-stage detector (sw_threshold_mult ...
#   noise_window_s below). Kept for the generator's synthetic signals: their
#   muzzle blast is as sharp and high-frequency as a shockwave, which the
#   classifier (correctly, for real recordings) labels a SW.
method = classify

# --- classify ---
# SW band and MB band(s) (Hz). Several MB bands may be listed ("lo,hi; lo,hi"):
# each MB candidate then uses whichever band is clearer. Default: ONE band,
# 150-1000 Hz -- the best single band on the Cipatat development set (shots of
# 12.7 mm and below, see sound/Cipatat/metadata.md). Band sweep, Nov 2026: the
# weakest muzzle blast still stands +8.2 dB above any other event (100-1000 Hz:
# +5.9 dB, limited by wind noise below 150 Hz in shot-03). With the large-calibre
# cannons included, 100-1000 Hz was best (they need the 100-150 Hz range).
sw_band_hz = 1000,4000
mb_bands_hz = 150,1000
# SW: SW band >= sw_min_hf_snr_db above noise, impulsive (crest >= sw_min_crest_db)
# and a near-instant front (10-90 % rise <= sw_max_rise_ms). Tuned on the Cipatat
# development set (12.7 mm and below, Nov 2026):
#   real SWs: >= 37 dB, crest >= 16.6 dB, rise <= 0.059 ms
#   MBs:      crest <= 11.9 dB where the rise is <= 0.08 ms (shot-04)
# so crest 14 dB leaves >= 2 dB margin both ways (12 dB left only 0.4 dB to shot-02's MB).
# The 1-4 kHz band was kept: 1.5-6 kHz and 2-8 kHz raise the SW crest ~1.5 dB but
# mistime shot-04's MB. sw_max_lf_width_ms (> 0) adds an alternative to the front
# test -- a short 50-800 Hz body -- which only the 105/120 mm cannons needed; 0 = off.
sw_min_hf_snr_db = 25.0
sw_min_crest_db = 14.0
# 0.10 ms (Nov 2026; was 0.08): weak shocks near the Mach 1.1 limit rise slower (generator:
# 7.62x39 at 350 m 0.095 ms, 12.7 mm at 800 m 0.085 ms). Cipatat unchanged; Zenodo blasts
# taken as SW stay 1 of 229 (0.12 ms would make it 7).
sw_max_rise_ms = 0.10
sw_max_lf_width_ms = 0
# MB: not a SW, MB band >= mb_min_lf_snr_db above noise, and the SW band may exceed
# the MB band (each relative to its own noise floor) by at most mb_max_hf_excess_db.
# 11 dB with a single band (Cipatat shot-03's weak MB: ~14 dB in 150-1000 Hz).
# mb_max_hf_excess_db 12 dB (was 10 until Nov 2026): the MINIMI burst (shot-04) has rounds whose
# MB exceeds 10 dB (10.2-11.1 dB); with 10 dB the SW was paired with the next round's MB.
mb_min_lf_snr_db = 11.0
mb_max_hf_excess_db = 12.0
# ... and stand at least mb_min_prominence_db above the median MB-band level of the
# 50-250 ms before it (rejects bumps in a decaying tail; Cipatat's weakest MB: 11.8 dB).
mb_min_prominence_db = 6.0
# The SW's echo tail is not searched for the MB (low-frequency echoes of large
# calibres look exactly like an MB). true = accept a clearly low-frequency event
# inside the tail when none is found after it (very close shots).
mb_in_tail = false
# Project rule: only supersonic bullets are detected (Mach >= 1.1 where the shock is emitted,
# i.e. a shockwave must be heard). true = a muzzle blast without a shockwave (subsonic round,
# a bullet already below Mach 1.1, or the array outside the Mach cone) is not reported as a
# shot; it is listed in blast_only_events. Stage 3 fits only Mach >= [range] mach_min (1.1).
supersonic_only = true

# --- several shots (bursts, repeated shots), classify only ---
# multi_shot = true: Stage 1 reports every shot (gs_det_events.detect_shots); Stages 2 and 3
# compute TDOA and location for each ('shots' in their .json; top level = shot 1).
# Project limit: bursts of at most 600 rpm (rounds >= 100 ms apart). Echoes also arrive
# 25-200 ms after a shot, so rounds are told from echoes mainly by SW pairing and direction:
#   - supersonic: each SW is paired with the MB at the common SW -> MB delay (the earliest delay
#     shared by the most SWs; an echo of the MB train is a second, later train). Tolerance
#     max(pair_tol_ms, pair_tol_frac x delay); delays from min_dt_s (a SW's own LF body follows
#     within 25 ms) to max_dt_s. SWs within sw_train_db of the strongest form the train.
#   - no SW: MB candidates more than direction_gate_deg away from the shooter direction (the
#     direction with the most level-weighted support) are echoes. Needs a synchronised array.
#   - no SW: of two MB candidates closer than min_shot_interval_s, only the stronger is kept
#     (600 rpm = 100 ms, minus 10 % cadence spread). Not used with SWs: pairing separates them.
#   - no SW and no usable array: later echoes cannot be rejected; shots are flagged echo_risk.
multi_shot = true
direction_gate_deg = 20.0
pair_tol_ms = 8.0
pair_tol_frac = 0.02
min_dt_s = 0.030
# MB waiting deadline (s after the SW). auto = the longest possible SW -> MB delay of any
# calibre in [bullet_reference_library]: only bullets at >= [range] mach_min (1.1) make a
# shockwave, and the delay is at most s/c - t_bullet(s) at the point s where the bullet slows to
# that Mach (or deadline_max_range_m) -- whatever the miss distance. Computed at the coldest
# expected air (deadline_min_temp_c: slower sound, more drag = longer delay) plus
# deadline_margin. With the current library: ~1.8 s (12.7 M33), 0.9 s for 5.56 / 7.62x51.
# Or give a number (s).
max_dt_s = auto
deadline_min_temp_c = 5.0
deadline_margin = 0.05
deadline_max_range_m = 2000.0
sw_train_db = 12.0
min_shot_interval_s = 0.090
# Bursts (2+ SWs): a round's MB can fall 5-60 ms after another round's SW, whose reverberation
# adds high frequencies; there the mb_max_hf_excess_db limit is raised by this (dB).
tail_hf_allowance_db = 3.0
# One SW whose only MB candidate lies inside its echo tail (shots at 50-100 m, the project's
# minimum range is 50 m): accepted when the array shows the SW and that MB at most this many
# degrees apart (the Mach-cone angle: 49-57 deg in Cipatat; a SW echo was 119 deg off).
# Multi-shot only; mb_in_tail = true accepts such MBs without the check.
mb_tail_max_angle_deg = 75.0

# --- threshold ---
# Two-stage event detector (Section 8.3-style): SW via simple amplitude
# threshold, MB via energy-based search in [dt_min, dt_max] after SW onset.
sw_threshold_mult = 10.0
mb_energy_threshold_mult = 20.0
dt_min_s = 0.01
dt_max_s = 5.0
noise_window_s = 0.005

[tdoa]
# method = xcorr (default) or gcc_phat.
#   xcorr: plain cross-correlation of the band-passed event in a short window around the
#     reference channel's onset (bands and windows below). Works on real recordings.
#   gcc_phat: the original method (windows sw_/mb_window_*). It returns ~0 us for every pair
#     on recordings whose background noise is common to all channels (Cipatat), because the
#     PHAT weighting locks onto that zero-delay noise.
method = xcorr
xcorr_sw_band_hz = 1000,8000
xcorr_mb_band_hz = 150,1000
# xcorr windows (s) before / after the reference channel's onset. They must contain the
# event on every channel (PILAR-V: up to ~1.04 ms apart) but little of what follows
# (ground reflection, echoes).
xcorr_sw_window_pre_s = 0.0015
xcorr_sw_window_post_s = 0.003
xcorr_mb_window_pre_s = 0.005
xcorr_mb_window_post_s = 0.030
# MB pair TDOAs must add up: tau(a,b) = tau(0,b) - tau(0,a). When the worst mismatch is above
# this (s), another event probably fell into the MB window (in a burst: the SW or an echo of a
# later round). The MB TDOAs are then redone with 1/2 and 1/4 of the window and the most
# consistent set is kept. 0 = off. Single shots in the Cipatat set stay below 25 us.
mb_closure_tol_s = 0.00005
# upsampling factor (both methods)
interp_factor = 16
# gcc_phat windows
sw_window_pre_s = 0.003
sw_window_post_s = 0.015
mb_window_pre_s = 0.006
mb_window_post_s = 0.080
# Lag search range (s). Stage 2 raises it automatically to 1.1 x (array aperture / c)
# when the array is larger (PILAR-V: ~1.14 ms).
max_lag_s = 0.001

[bullet_reference_library]
# Reference data for KNOWN ammunition types -- used by
# gs_det_classify_bullet.py to compare the observed signal against, exactly
# as a real classifier would use a reference database. This is intentionally
# a SEPARATE, independently-maintained copy from the generation block's
# bullet library (same publicly-known physical constants, just not imported
# from gs_gen_physic.py) -- keeping the fairness boundary architectural,
# not just conventional.
#
# Per caliber: d = bullet diameter (m) and L = bullet length (m) -- the two values Method B
# needs (Whitham N-wave equations, see gs_det_classify_bullet.py); v0 = muzzle velocity (m/s)
# bounds the Mach solution; lam = speed decay length (m) of v(s) = v0 exp(-s / lam).
# Stage 3's drag-aware range fit (gs_det_shooter_locator.py, [range] model = drag) fits every
# calibre here that has v0 (lam empty or 0 = constant speed). v0 and lam are COMPUTED from
# ammunition data (python/ammo_data.csv: muzzle velocity, G1/G7 ballistic coefficient) by
# util_ballistic_library.py (standard drag tables, ICAO 15 C / 101.325 kPa, lam fitted to the
# time of flight above Mach 1.1, max 2000 m; print these lines with --ini). Stage 3 scales lam
# with the air temperature ([range] lam_temperature_scaling). Several ammo_data.csv inputs are
# approximate: check them against your ammunition's tables and rerun the utility. (One table since Nov 2026; Stage 3's separate [ballistics]
# section was merged into this one.)
# Covers every small-arms calibre of the Cipatat development set (sound/Cipatat).
# (Until Nov 2026 Method B used a reference peak dP0_sw at b0_sw instead of d; those keys
# are no longer read.)
# Calibre hierarchy (project rule, Nov 2026). Results are reported at three levels:
#   category  small (< 7.62 mm), medium (7.62 to < 12.7 mm), big (12.7 to 40 mm), RPG, other
#   class     the nominal bore number, covering all its variants: 5.56, 7.62, 8.6, 12.7, 20, ...
#   variant   one entry below, with its own properties (d, L, v0, lam): 7.62x39, 7.62_NATO
#             (7.62x51), 7.62x54R, 8.6x70 (.338 Lapua), 12.7_NATO (12.7x99), ...
# Class and category come from the name; override with <cal>_class / <cal>_category.
# Range still uses each cartridge's own ballistics (the best-fitting one).
calibers = 5.56_NATO,7.62_NATO,7.62x39,7.62x54R,8.6x70,12.7_NATO
# 5.56x45 M855/SS109 (M16, MINIMI 5.56)
5.56_NATO_d = 0.0057
5.56_NATO_L = 0.023
5.56_NATO_v0 = 948
5.56_NATO_lam = 765
# 7.62x51 M80 ball (MINIMI 7.62, SM2)
7.62_NATO_d = 0.00782
7.62_NATO_L = 0.0285
7.62_NATO_v0 = 838
7.62_NATO_lam = 971
# 7.62x39 M43 (AK47)
7.62x39_d = 0.00792
7.62x39_L = 0.0268
7.62x39_v0 = 718
7.62x39_lam = 701
# 7.62x54R 7N1 (Dragunov)
7.62x54R_d = 0.00792
7.62x54R_L = 0.032
7.62x54R_v0 = 823
7.62x54R_lam = 994
# 8.6x70 .338 Lapua Magnum 250 gr (AX338)
8.6x70_d = 0.00858
8.6x70_L = 0.0394
8.6x70_v0 = 905
8.6x70_lam = 1605
# 12.7x99 M33 ball (STEYR HS50)
12.7_NATO_d = 0.01295
12.7_NATO_L = 0.058
12.7_NATO_v0 = 887
12.7_NATO_lam = 1745

[range]
# Stage 3 range model: 'drag' (drag-aware fit, default) or 'constant' (old
# constant-speed PILAR-V solve, kept for comparison).
model = drag
# Caliber reported when the fit cannot tell calibers apart (no usable T_N).
default_caliber = 5.56_NATO
# The bullet must still be above mach_min * c where the shock is emitted (project rule: 1.1).
mach_min = 1.1
# Search window for the shooter distance (m) and number of grid points. The project covers
# 50-2000 m; the window is wider so that estimates near the limits are not clipped.
min_range_m = 5.0
max_range_m = 2200.0
n_grid = 240
# Scale the library's lam (given for 15 C) with the air density at the measured temperature:
# lam x (T + 273.15) / 288.15. Only when a temperature is known ([physics] or --temperature-c).
lam_temperature_scaling = true
# Project limits (m). A shot located closer than friendly_range_m is flagged 'friendly'
# (inside the own position: not reported as a non-friendly shot). One located beyond
# max_report_range_m is flagged 'beyond_max_range' (outside the project's 2000 m).
friendly_range_m = 50.0
max_report_range_m = 2000.0
# Measurement uncertainties used to weight the fit:
#   direction_sigma_deg  SW / MB direction error (PILAR-V on Cipatat: ~2 deg)
#   dt_sigma_ms          SW -> MB delay error
#   t_n_sigma_log        N-wave duration error, as a log ratio (0.3 ~ +-35 %);
#                        0 = do not use T_N (caliber then = default_caliber)
#   miss_sigma_m         soft prior on the miss distance: shockwaves are detected
#                        from bullets passing within tens of metres; 0 = no prior
# Measured N-wave durations (Stage 1: front to rear shock, sub-sample) are longer than Whitham's
# T_N by the sensor's response, which rounds both shocks. Subtracted before the fit (s).
# PILAR-V on Cipatat (shots 01, 02, 06, 15, 16, 17, known calibre and miss distance): +29 to
# +38 us -> 35 us. Measure it for another sensor; 0 = no correction.
t_n_offset_s = 0.000035
# SW peak amplitude term (Whitham dP, Pa from [calibration] assumed_peak_pa_at_full_scale),
# as a log ratio: with T_N it pins the miss distance AND the bullet size, so it separates
# calibres. 0.35 ~ +-3 dB, the uncertainty of the full-scale estimate. 0 = not used.
dp_sigma_log = 0.35
# Clipped SW ([calibration] sw_clip_pa / clip_flat_samples): the measured peak is a lower bound,
# and the peak estimated from the length of the flat top (N-wave: P = C / (1 - 2 tau / T_N))
# is fitted with this looser uncertainty (log ratio; 0.5 ~ +-4 dB).
dp_clip_sigma_log = 0.5
direction_sigma_deg = 1.5
dt_sigma_ms = 0.2
t_n_sigma_log = 0.3
miss_sigma_m = 50

[calibration]
# The detector's OWN assumed hardware sensitivity -- what peak pressure (Pa)
# a full-scale (1.0) code of the INPUT WAV represents. A real system would know
# this from its OWN mic/preamp/ADC calibration (see gs_gen_apply_adc.py's
# analog_chain for the generation-side equivalent) -- it is NOT read from
# the generation block; it's this detector's independent assumption about
# its own (hypothetical, for a real system: measured) hardware.
# Stage 4 converts dP = (Stage-1 normalized dP) x normalization_peak x this value.
# 1520 Pa: the PILAR-V estimate from the Cipatat shockwaves against Whitham theory
# (157.6 dB SPL peak, +-3 dB; sound/Cipatat/metadata.md, "Sound levels"). It also fits the
# generator's default chain (SW peak ~148 Pa written at 0.098 FS -> ~1510 Pa). Until Nov 2026
# this was 175 Pa applied to the peak-normalized dP, which is about the same for simulations.
assumed_peak_pa_at_full_scale = 1520.0
# Per-array override: assumed_peak_pa_at_full_scale.<mic_config> (e.g. ...UMA8 = <value>)
# is used instead when that preset is active.
# UMA-8 v2 (Knowles SPH1668LM4H-1 capsules, -29 dBFS at 94 dB SPL): digital full scale ~123 dB
# SPL for a sine, i.e. ~40 Pa peak -- NOMINAL: the XMOS decimator gain between capsule and USB
# samples is unpublished (0, +6.3 or +18 dB possible); measure it with a sound level meter.
assumed_peak_pa_at_full_scale.UMA8 = 40.0
# Clipped shockwave: Stage 1 flags a SW as clipped when its top stays flat (within 0.5 %) for
# >= clip_flat_samples samples, or when its peak reaches 90 % of sw_clip_pa (the microphone's
# overload level in Pa peak; 0 = unknown). A clipped peak is then only a LOWER BOUND in the
# Stage 3 fit. UMA-8 capsule overload: 122 dB SPL (10 % THD) ~ 36 Pa peak. Bullets passing
# within ~60-180 m of a UMA-8 (5.56 ... 12.7 mm) overload it.
sw_clip_pa = 0
sw_clip_pa.UMA8 = 36.0
clip_flat_samples = 3

[deconvolution]
# Optional: remove room reverberation BEFORE onset detection, using the
# array's own measured room impulse response (estimated from a calibration
# recording made at install time -- NOT from any generation ground truth).
# This is the most effective fix for the RT60-vs-event-gap overlap problem
# that otherwise breaks GCC-PHAT when the shockwave's reverb tail is still
# ringing when the muzzle blast arrives (e.g. the default 200m/RT60=1.25s
# config where Dt~324ms < RT60).
#
# To use: record the array's response to a log-sweep played in the
# deployment environment (matching sweep_f0_hz/sweep_f1_hz/sweep_duration_s
# and the same fs as your live recordings), then set:
#   enabled = true
#   calibration_wav = path/to/calibration_recording.wav
# OR pass --calibration-wav on the command line.
#
# Validated in project testing: calibration-sweep-estimated RIR (even with
# only ~0.64 correlation to the true response) recovered sub-5 us TDOA
# accuracy on a case that completely failed (466+ us errors) without it.
enabled = false
calibration_wav =
sweep_f0_hz = 40.0
sweep_f1_hz = 20000.0
sweep_duration_s = 1.0
rir_length_s = 2.0
regularization = 0.01

[output]
basename = det_result
# Calibre in the results (project rule, Nov 2026): caliber_category (small, medium, big, RPG,
# other) is always written -- null with caliber_category_reason when it cannot be determined
# (no shockwave, or no calibre fits). caliber_class (bore number) is optional: written when
# this is true. The variant (cartridge) is not reported; it only appears in the fit details.
report_caliber_class = true
