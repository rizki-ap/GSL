# gen_config.ini -- parameters for gs_gen_clean_signal.py, gs_gen_add_noise.py and gs_gen_apply_adc.py
#
# Edit and run:
#   python gs_gen_clean_signal.py gen_config.ini
#   python gs_gen_add_noise.py <name>_clean.wav gen_config.ini
#   python gs_gen_apply_adc.py <name>_noisy.wav gen_config.ini

[geometry]
# Tetrahedral microphone array edge length (m)
l_array = 0.30
# array_type: 'tetrahedron' (4 sensors, edge l_array) or 'custom'.
#   custom: mic_positions = x,y,z; x,y,z; ...   (metres)   or   mic_positions_file = mics.csv (one 'x,y,z' per row)
#   The noise and ADC stages assume 4 channels; for another number use the clean output directly.
array_type = tetrahedron
#mic_positions = 0,0,1; 0,0.9,-0.3; -0.8,-0.5,-0.3; 0.8,-0.5,-0.3
#mic_positions_file = mics.csv

[adc]
# Sample rate (Hz), ADC bit depth, and mic passband (Hz)
fs = 100000
bit_depth = 16
mic_lo = 40.0
mic_hi = 20000.0

[calibration]
# Reference sensitivity targets -- used when [analog_chain] enabled=false
# (the default). MEASURED from a real recording -- see
# estimate_acoustic_params.py to (re-)derive these from your own reference
# file if your mic/preamp/gain chain changes.
real_noise_rms = 0.000595
real_rt60 = 1.32
real_peak_norm = 0.098
real_noise_slope = -2.46

[analog_chain]
# Alternative to [calibration]'s peak-matching: compute the Pa-to-
# normalized-code scale directly from hardware datasheet numbers, so you
# can evaluate a candidate mic/preamp/ADC combo BEFORE you have a real
# recording with that hardware to calibrate against. Unlike peak-matching,
# this is an ABSOLUTE calibration -- it will genuinely report clipping if
# the chosen hardware can't handle this signal's SPL, which is the point.
enabled = false
# Mic sensitivity in mV/Pa (most measurement-mic datasheets state this
# directly; if yours instead gives dBV/Pa, convert with
# gunshot_physics.dbv_per_pa_to_v_per_pa() first). 22.4 mV/Pa here is a
# typical prepolarized measurement mic.
mic_sensitivity_mv_per_pa = 22.4
# Preamp gain in dB. NOTE: this default (10 dB) is deliberately LOW,
# appropriate for high-SPL blast/gunshot measurement (a shockwave at close
# range can exceed 140 dB SPL) -- a more "typical" 40 dB general-purpose
# preamp gain WILL clip on this signal with the mic sensitivity above; try
# it to see the clipping warning in action.
preamp_gain_db = 10.0
# ADC's peak input voltage for a full-scale (+-1.0 normalized) code --
# check your ADC's datasheet for whether this is Vref, Vref/2, etc.
# depending on its specific input architecture.
adc_vref_peak_v = 2.5

# Optional per-channel overrides -- for when your 4 mics/AFEs genuinely
# differ (different models, or just normal manufacturing tolerance: even
# nominally-identical mics typically vary +-1-3dB in sensitivity). Omit any
# channel/key you don't need to override; missing values fall back to the
# nominal [analog_chain] values above. Only used when analog_chain.enabled
# = true.
#[analog_chain_ch0]
#mic_sensitivity_mv_per_pa = 21.8
#
#[analog_chain_ch1]
#preamp_gain_db = 10.3
#
#[analog_chain_ch2]
#mic_sensitivity_mv_per_pa = 23.0
#preamp_gain_db = 9.7

[adc_multi_channel]
# Models what a SINGLE ADC chip shared across all 4 mic channels adds on
# top of each channel's own mic/preamp gain (only meaningful when
# analog_chain.enabled = true -- peak-matching mode can't represent this).
#
# type: 'simultaneous' (e.g. AD7606B/ADS8688 -- all channels sampled at the
#   same instant) or 'multiplexed' (e.g. the DE10-Nano's onboard LTC2308 --
#   channels sampled SEQUENTIALLY). Multiplexed introduces real timing skew
#   between channels: channel i is delayed by i * conversion_time_us
#   relative to channel 0 -- directly corrupting a TDOA measurement, which
#   is the entire point of this array. This is the single most important
#   thing to get right if you're choosing between ADC architectures.
type = simultaneous
conversion_time_us = 2.0
# Channel-to-channel gain/offset matching spec from the ADC datasheet
# (0 = disabled). Usually a much smaller effect than timing skew, but real.
gain_mismatch_pct = 0.0
offset_mismatch_mv = 0.0
mismatch_seed = 42

[bullet]
# caliber: '5.56_NATO', '7.62_NATO' or '9mm_Parabellum' (selects bullet diameter, length, nominal speed)
caliber = 5.56_NATO
# Bullet speed as a Mach number (used if muzzle_velocity_mps = 0)
mach = 2.5
# Optional overrides (0 = use the library / mach): muzzle velocity (m/s), bullet diameter and length (mm)
muzzle_velocity_mps = 0
diameter_mm = 0
length_mm = 0

[trajectory]
# mode = range_miss: shooter at (-range, y_miss, 0), array centroid at origin, bullet flies +x.
# mode = explicit:   shooter_pos plus direction (vector) or azimuth/elevation (ENU, azimuth 0 = +x).
mode = range_miss
range = 200.0
y_miss = 10.0
#shooter_pos = -200,10,0
#direction = 1,0,0
#azimuth_deg = 0
#elevation_deg = 0

[atmosphere]
# ISO 9613-1 atmospheric absorption (frequency-dependent molecular
# absorption from O2/N2 relaxation) -- an additional attenuation on top of
# the geometric 1/sqrt(b) and 1/r spreading laws. Modest at these pulses'
# characteristic frequencies (~1-2 kHz) and short-to-medium range, but
# grows with distance and matters more at higher frequencies.
enabled = true
temp_c = 20.0
humidity_pct = 50.0
pressure_kpa = 101.325

[propagation]
# Uniform wind vector (m/s, ENU x,y,z). First order: acts on the acoustic path only.
# The speed of sound follows from atmosphere.temp_c.
wind_mps = 0,0,0

[shockwave]
# N-wave from Whitham weak-shock scaling (dP ~ b^-3/4, duration ~ b^1/4; depends on bullet
# diameter, length and Mach number). No shock is generated for Mach <= mach_threshold or at
# sensors the Mach cone does not reach. amp_scale / dur_scale calibrate against recordings.
mach_threshold = 1.1
amp_scale = 1.0
dur_scale = 1.0

[muzzle_blast]
# Friedlander pulse with Hopkinson-Cranz scaling (Kinney-Graham fits, Z = r / W^(1/3)).
# w_g_tnt is an empirical equivalent charge in grams (PLACEHOLDER -- calibrate to a recording);
# amp_scale / dur_scale give a second and third calibration handle.
w_g_tnt = 2.0
amp_scale = 1.0
dur_scale = 1.0

[timing]
# Master timeline padding around the two events (s)
pre_roll = 0.010
post_roll = 0.150

[noise]
# model: 'simple' (flat noise floor only) or 'realistic' (reverb + colored
# noise + mic bandpass -- the fuller model, matches Section 7.3)
model = realistic
noise_floor_pa = 0.005
rt60 = 1.25
noise_rms_pa = 0.075
noise_slope = -2.4

[output]
# Output files will be <basename>.wav and <basename>.json
basename = gunshot_sim
# Random seed (noise/reverb realizations only -- physics is deterministic)
seed = 0
