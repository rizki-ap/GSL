# gen_config.ini -- parameters for gs_gen_clean_signal.py, gs_gen_add_noise.py and gs_gen_apply_adc.py
#
# Edit and run:
#   python gs_gen_clean_signal.py gen_config.ini
#   python gs_gen_add_noise.py <name>_clean.wav gen_config.ini
#   python gs_gen_apply_adc.py <name>_noisy.wav gen_config.ini
#
# Microphone array: add -mic_config=UMA8 to the first command to simulate the miniDSP UMA-8
# (the next two stages pick it up from the .json):
#   python gs_gen_clean_signal.py gen_config.ini -mic_config=UMA8
# Shockwave only or muzzle blast only: add -components=shockwave or -components=muzzle_blast
# to the first command (default: both, see [signal]).

[signal]
# Acoustic events to synthesise (overridden by -components=... on the command line):
#   both          shockwave + muzzle blast (default)
#   shockwave     the bullet's N-wave only (an error if no microphone receives a shockwave:
#                 subsonic bullet or outside the Mach cone)
#   muzzle_blast  the muzzle blast only
#   aliases: sw, mb, blast
# With one event the time axis spans only that event (timing.pre_roll before its first arrival,
# timing.post_roll after its last). The ground truth still describes both events; the
# 'generated' flags in it say which ones are in the signal.
# Note: with analog_chain.enabled = false the ADC stage scales every signal so its peak matches
# calibration.real_peak_norm, so levels are not comparable between the three choices; enable the
# analog chain for absolute (pascal-referenced) levels.
components = both

[geometry]
# Microphone array preset used when -mic_config is not given on the command line.
# Each preset is a [mic_config.<NAME>] section below; add your own section to define another
# array and select it with -mic_config=<NAME>. Keys a preset does not set fall back to this
# section ([geometry] l_array, array_type, mic_positions, mic_positions_file).
#   Tetrahedral-0,3  regular tetrahedron, 0.30 m edge (default; formerly "PilarV")
#   PILAR-V          the real PILAR-V sensor geometry (Cipatat recordings)
#   UMA8             miniDSP UMA-8 v2 (4 of its mics)
mic_config = Tetrahedral-0,3

[mic_config.PILAR-V]
# PILAR-V acoustic sensor ("Trackball"; nominal geometry, identical in every unit's
# configuration header (format_version 2). This is the array of the Cipatat recordings
# (sound/Cipatat): 4 channels, 51.2 kHz, 24-bit, 8.8 mV/Pa per mic.
#   ch1-ch3: horizontal ring, radius 0.2055 m, at 0 / 120 / 240 deg (0.356 m apart)
#   ch4:     on the vertical axis, 0.2412 m above the ring (0.317 m from each ring mic)
# Recording channels 0-3 = ch1-ch4 (natural order, verified on Cipatat: direction errors
# 2.4 deg az / 2.0 deg el RMS, Nov 2026). Sensor frame: x = north (within ~1 deg on Cipatat),
# y = west, z = up -- so compass azimuth (clockwise from north) = -atan2(y, x) of the
# pipeline's direction vector. Largest mic spacing 0.356 m -> max TDOA ~1.04 ms.
array_type = custom
mic_positions = 0.2055,0,0; -0.1028,0.178,0; -0.1028,-0.178,0; 0,0,0.2412

[mic_config.Tetrahedral-0,3]
# Regular tetrahedral 4-mic array (the project's original simulation geometry, formerly named
# "PilarV"). l_array = 0.30 m is the EDGE length (mic-to-mic spacing); circumradius 0.184 m.
# array_type: 'tetrahedron' (4 sensors, edge l_array) or 'custom'.
#   custom: mic_positions = x,y,z; x,y,z; ...   (metres)   or   mic_positions_file = mics.csv (one 'x,y,z' per row)
array_type = tetrahedron
# Tetrahedral microphone array edge length (m)
l_array = 0.30
#mic_positions = 0,0,1; 0,0.9,-0.3; -0.8,-0.5,-0.3; 0.8,-0.5,-0.3
#mic_positions_file = mics.csv

[mic_config.UMA8]
# miniDSP UMA-8 v2 USB mic array (see devices/UMA-8-usb_mic_array.md), using 4 of its 7 mics:
# the centre mic #0 (origin) and ring mics #1, #3, #5 (42.5 mm radius, 120 deg apart; the ring
# starts on +y and goes clockwise seen from +z, so #1 = +y). Board lying flat, all mics at z = 0.
# Output channels 0-3 = mics #0, #1, #3, #5. Numbering/rotation as in ODAS minidsp.cfg --
# verify against the real board (tap test) before trusting channel order.
array_type = custom
mic_positions = 0,0,0; 0,0.0425,0; 0.036806,-0.02125,0; -0.036806,-0.02125,0

[adc]
# Sample rate (Hz), ADC bit depth, and mic passband (Hz)
fs = 100000
bit_depth = 16
mic_lo = 40.0
mic_hi = 20000.0

[calibration]
# Reference sensitivity targets -- used when [analog_chain] enabled=false
# (the default). MEASURED from a real recording -- see
# estimate_acoustic_params.py to (re-)derive these from your own reference
# file if your mic/preamp/gain chain changes.
real_noise_rms = 0.000595
real_rt60 = 1.32
real_peak_norm = 0.098
real_noise_slope = -2.46

[analog_chain]
# Alternative to [calibration]'s peak-matching: compute the Pa-to-
# normalized-code scale directly from hardware datasheet numbers, so you
# can evaluate a candidate mic/preamp/ADC combo BEFORE you have a real
# recording with that hardware to calibrate against. Unlike peak-matching,
# this is an ABSOLUTE calibration -- it will genuinely report clipping if
# the chosen hardware can't handle this signal's SPL, which is the point.
enabled = false
# Mic sensitivity in mV/Pa (most measurement-mic datasheets state this
# directly; if yours instead gives dBV/Pa, convert with
# gunshot_physics.dbv_per_pa_to_v_per_pa() first). 22.4 mV/Pa here is a
# typical prepolarized measurement mic.
mic_sensitivity_mv_per_pa = 22.4
# Preamp gain in dB. NOTE: this default (10 dB) is deliberately LOW,
# appropriate for high-SPL blast/gunshot measurement (a shockwave at close
# range can exceed 140 dB SPL) -- a more "typical" 40 dB general-purpose
# preamp gain WILL clip on this signal with the mic sensitivity above; try
# it to see the clipping warning in action.
preamp_gain_db = 10.0
# ADC's peak input voltage for a full-scale (+-1.0 normalized) code --
# check your ADC's datasheet for whether this is Vref, Vref/2, etc.
# depending on its specific input architecture.
adc_vref_peak_v = 2.5

# Optional per-channel overrides -- for when your mics/AFEs genuinely
# differ (different models, or just normal manufacturing tolerance: even
# nominally-identical mics typically vary +-1-3dB in sensitivity). Omit any
# channel/key you don't need to override; missing values fall back to the
# nominal [analog_chain] values above. Only used when analog_chain.enabled
# = true.
#[analog_chain_ch0]
#mic_sensitivity_mv_per_pa = 21.8
#
#[analog_chain_ch1]
#preamp_gain_db = 10.3
#
#[analog_chain_ch2]
#mic_sensitivity_mv_per_pa = 23.0
#preamp_gain_db = 9.7

[adc_multi_channel]
# Models what a SINGLE ADC chip shared across all mic channels adds on
# top of each channel's own mic/preamp gain (only meaningful when
# analog_chain.enabled = true -- peak-matching mode can't represent this).
#
# type: 'simultaneous' (e.g. AD7606B/ADS8688 -- all channels sampled at the
#   same instant) or 'multiplexed' (e.g. the DE10-Nano's onboard LTC2308 --
#   channels sampled SEQUENTIALLY). Multiplexed introduces real timing skew
#   between channels: channel i is delayed by i * conversion_time_us
#   relative to channel 0 -- directly corrupting a TDOA measurement, which
#   is the entire point of this array. This is the single most important
#   thing to get right if you're choosing between ADC architectures.
type = simultaneous
conversion_time_us = 2.0
# Channel-to-channel gain/offset matching spec from the ADC datasheet
# (0 = disabled). Usually a much smaller effect than timing skew, but real.
gain_mismatch_pct = 0.0
offset_mismatch_mv = 0.0
mismatch_seed = 42

[bullet]
# caliber (diameter, length, nominal speed and drag from the library in gs_gen_physic.py):
#   5.56_NATO (alias 5.56x45)  7.62_NATO (7.62x51)  7.62x39  7.62x54R  8.6x70 (.338 Lapua)
#   12.7_NATO (12.7x99)  9mm_Parabellum (9x19)
# All small-arms calibres of the Cipatat development set are covered.
caliber = 5.56_NATO
# Bullet speed as a Mach number (used if muzzle_velocity_mps = 0)
mach = 2.5
# Optional overrides (0 = use the library / mach): muzzle velocity (m/s), bullet diameter and length (mm)
muzzle_velocity_mps = 0
diameter_mm = 0
length_mm = 0
# Bullet speed loss: 'none' (constant speed, the original model) or 'exponential'
# (v(s) = v0 exp(-s / decay_length); the shockwave stops where the bullet is no longer above
# shockwave.mach_threshold). decay_length_m = 0 uses the caliber's library value.
drag_model = none
decay_length_m = 0

[trajectory]
# mode = range_miss: shooter at (-range, y_miss, 0), array centroid at origin, bullet flies +x.
# mode = explicit:   shooter_pos plus direction (vector) or azimuth/elevation (ENU, azimuth 0 = +x).
mode = range_miss
range = 200.0
y_miss = 10.0
#shooter_pos = -200,10,0
#direction = 1,0,0
#azimuth_deg = 0
#elevation_deg = 0

[atmosphere]
# ISO 9613-1 atmospheric absorption (frequency-dependent molecular
# absorption from O2/N2 relaxation) -- an additional attenuation on top of
# the geometric 1/sqrt(b) and 1/r spreading laws. Modest at these pulses'
# characteristic frequencies (~1-2 kHz) and short-to-medium range, but
# grows with distance and matters more at higher frequencies.
enabled = true
temp_c = 20.0
humidity_pct = 50.0
pressure_kpa = 101.325

[propagation]
# Uniform wind vector (m/s, ENU x,y,z). First order: acts on the acoustic path only.
# The speed of sound follows from atmosphere.temp_c.
wind_mps = 0,0,0

[shockwave]
# N-wave from Whitham weak-shock scaling (dP ~ b^-3/4, duration ~ b^1/4; depends on bullet
# diameter, length and Mach number). No shock is generated for Mach <= mach_threshold or at
# sensors the Mach cone does not reach. amp_scale / dur_scale calibrate against recordings.
mach_threshold = 1.1
amp_scale = 1.0
dur_scale = 1.0

[muzzle_blast]
# Friedlander pulse with Hopkinson-Cranz scaling (Kinney-Graham fits, Z = r / W^(1/3)).
# w_g_tnt is an empirical equivalent charge in grams (PLACEHOLDER -- calibrate to a recording);
# amp_scale / dur_scale give a second and third calibration handle.
w_g_tnt = 2.0
amp_scale = 1.0
dur_scale = 1.0

[timing]
# Master timeline padding around the two events (s)
pre_roll = 0.010
post_roll = 0.150

[ground]
# Flat ground below the array, image-source reflection (Stage 1). The reflected shockwave is
# computed like the direct one at the mirror image of each mic: its own arrival time (it reaches
# the top mic later), miss distance, amplitude and duration. The reflected blast follows ~0.05 ms
# after the direct one at ranges of hundreds of metres and merges with it.
# Calibrated on Cipatat (sound/Cipatat/metadata.md, "Ground reflection"): array 1.2-1.3 m above
# ground, reflected/direct shockwave ratio 0.26-0.28 -> reflection_coeff_sw 0.33.
# reflection_coeff_mb is not measurable in Cipatat (merged); 0.9 is typical of grass at low frequency.
enabled = true
array_height_m = 1.3
reflection_coeff_sw = 0.33
reflection_coeff_mb = 0.9

[noise]
# model: 'layers' (choose any of the layers below), or the older 'simple' (flat noise floor)
# and 'realistic' (room reverb + independent colored noise; its reverb is a room, not a range)
model = layers
# room, echoes, colored, wind, tones, chirps, diffuse, real, impulses (see gs_gen_add_noise.py)
layers = colored, wind, echoes
# absolute: layer levels in Pa as given below. snr: the additive layers (all but impulses) are
# scaled together to snr_db = 20 log10(reference peak / noise rms); snr_ref = shockwave,
# muzzle_blast or peak
level_mode = absolute
snr_db = 30.0
snr_ref = shockwave
# used by model = simple / realistic only
noise_floor_pa = 0.005
rt60 = 1.25
noise_rms_pa = 0.075
noise_slope = -2.4

[noise.colored]
# Broadband noise, piecewise power-law PSD: slope (PSD ~ f^slope) below / between / above breaks_hz.
# Cipatat shot-03: f^-1.5 at 150-1000 Hz, f^-2.4 at 1-10 kHz. common_fraction: share of the
# noise power identical on all mics (real recordings: correlation 0.8-0.9 on several shots)
rms_pa = 0.02
breaks_hz = 1000
slopes = -1.5, -2.4
fmin_hz = 20
common_fraction = 0.3

[noise.wind]
# Gusty low-frequency noise, independent at each mic (turbulence at the windscreen)
rms_pa = 0.1
corner_hz = 20
slope = -2.0
gust_depth = 0.6
gust_rate_hz = 0.3

[noise.tones]
# Machinery: f0_hz, n_harmonics, level_pa (rms of the fundamental), azimuth_deg, elevation_deg; ...
# Azimuth counter-clockwise from +x (PILAR-V: x = north, y = west, so compass bearing = -azimuth).
# Default: the two engines heard in Cipatat shot-03 (bearing 75 deg and 22 deg)
sources = 83.6, 3, 0.02, -75, -40; 412, 2, 0.01, -22, -25
drift_pct = 0.1

[noise.chirps]
# Insects: freq_hz, level_pa (rms in a pulse), azimuth_deg, elevation_deg, pulse_rate_hz, duty; ...
sources = 3800, 0.003, -115, 0, 3.0, 0.3; 4180, 0.003, -115, 0, 3.0, 0.3

[noise.diffuse]
# Noise from all directions (n_directions plane waves): correct inter-mic coherence
rms_pa = 0.01
slope = -2.0
fmin_hz = 20
n_directions = 64

[noise.real]
# Noise cut from real multichannel recordings (same mic geometry!). scale converts the file
# values to Pa (Cipatat: 1520). Loud impulsive parts are left out when exclude_events = true.
# rms_pa = 0 keeps the recorded level. Example:
# files = ../sound/Cipatat/shot-05_audio_4ch_cut.wav, ../sound/Cipatat/shot-06_audio_4ch_cut.wav
files =
scale = 1520
rms_pa = 0
exclude_events = true

[noise.echoes]
# Discrete outdoor echoes of the Stage-1 signal, each from its own direction. Random: n echoes
# with delay_ms and gain drawn from the ranges, low-passed at lowpass_hz. Or give them:
# list = delay_ms, gain, azimuth_deg, elevation_deg; ...
n = 3
delay_ms = 20, 400
gain = 0.05, 0.25
lowpass_hz = 3000
elevation_deg = 0, 20
list =

[noise.room]
# Diffuse reverberation (indoors, urban canyon): rt60 and direct-to-reverberant ratio
rt60 = 1.25
drr_db = 10.0

[noise.impulses]
# Interfering impulsive sounds for false-alarm tests (times listed in the .json):
# rate_per_s, level_pa (peak, min, max), kinds (blast, click, nwave), guard_s around true events
rate_per_s = 0.2
level_pa = 0.5, 5
kinds = blast, click, nwave
guard_s = 0.05
elevation_deg = -10, 30

[output]
# Output files will be <basename>.wav and <basename>.json
basename = gunshot_sim
# Random seed (noise/reverb realizations only -- physics is deterministic)
seed = 0
